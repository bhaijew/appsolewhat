name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build APK (Release)
        timeout-minutes: 15
        run: flutter build apk --release --verbose

      - name: Extract Tag or Version
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v1.0.14-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Copy Named APK
        run: |
          mkdir -p build/app/outputs/flutter-apk
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ] && [ -f build/app/outputs/apk/release/app-release.apk ]; then
            cp build/app/outputs/apk/release/app-release.apk build/app/outputs/flutter-apk/app-release.apk
          fi
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SoleWhat-Admin-${{ steps.vars.outputs.VERSION }}.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.VERSION }}
          name: SoleWhat Admin ${{ steps.vars.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SoleWhat-Admin-${{ steps.vars.outputs.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
